[config]
reload_apps = true

[templates.mango]
input_path = "/home/swavlabs/.config/matugen/templates/mango.conf"
output_path = "/home/swavlabs/.config/mango/colors.conf"


[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.swaync]
input_path = "/home/swavlabs/.config/matugen/templates/swaync.css"
output_path = "/home/swavlabs/.config/swaync/style.css"
post_hook = "swaync-client -rs"

[templates.fuzzel]
input_path = './templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'


[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

