env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_FORCE_DPI,140
env=QT_QPA_PLATFORM,Wayland;xcb

# Session type
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland


# Environment variables for non-mango items (waybar, noctalia, etc.)
# Note: Icon theme is handled by GTK settings files (~/.config/gtk-3.0/settings.ini)

# GTK/QT theming - force dark mode
#env=GTK_THEME,Adwaita-dark
env=QT_QPA_PLATFORMTHEME,qt6ct

# Force dark mode for libadwaita/GTK4 apps
#env=GTK_THEME_VARIANT,dark

# Cursor and icon themes
env=XCURSOR_THEME,Moga-Candy-Teal
env=XCURSOR_SIZE,24

# Include flatpak exports for icons and desktop files
# Full XDG_DATA_DIRS with flatpak paths prepended
env=XDG_DATA_DIRS,/home/swavlabs/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/home/swavlabs/.local/share:/usr/local/share:/usr/share


